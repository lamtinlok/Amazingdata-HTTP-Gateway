# ============================================================================
# AmazingData HTTP 网关 - 配置模板
# ----------------------------------------------------------------------------
# 使用方式:
#   1. 复制本文件为同目录下的 config.ini:  cp config.example.ini config.ini
#   2. 把下面 <...> 占位符替换成你自己的真实值
#   3. config.ini 含敏感凭据, 已被 .gitignore 忽略, 切勿提交到公开仓库
#
# 配置优先级: 环境变量 > config.ini > 下方默认值
#   可用环境变量(统一前缀, 避开系统的 USER/HOST/PORT):
#     TGW_USER  TGW_PASSWORD  TGW_HOST  TGW_PORT
#     HTTP_HOST  HTTP_PORT  AMAZINGDATA_CONFIG  AMAZINGDATA_SDK_LOG_DIR
# ============================================================================

[tgw]
# AmazingData 数据源(即"数据库"入口)登录信息
# user / password: 向你的数据服务商申请的账号与密码
# host / port:     数据源服务器地址与端口(跑数据服务的那台机器)
user     = <你的TGW账号>
password = <你的TGW密码>
host     = <数据源服务器IP或域名>
port     = 8600

[server]
# HTTP 服务监听地址与端口(即运行本脚本的这台机器)
# host=0.0.0.0 表示监听所有网卡; 若仅本机访问可改为 127.0.0.1
host = 0.0.0.0
port = 8000

[paths]
# 本地缓存目录(行情/数据落盘位置), 相对脚本目录或绝对路径均可
local_data = local_data

[preload]
enabled = 1
# ---------------------------------------------------------------------------
# 市场键(8 类):
#   stock  A股股票    etf  ETF        index  指数      kzz  可转债
#   glra   逆回购     hkt  港股通     future 期货      option ETF期权
# 各自对应的 security_type / period / SubscribeDataType:
#   stock  EXTRA_STOCK_A       snapshot(10014)       kSnapshot(10)
#   etf    EXTRA_ETF           snapshot(10014)       kSnapshot(10)
#   index  EXTRA_INDEX_A       snapshot(10014)       kIndexSnapshot(13)
#   kzz    EXTRA_KZZ           snapshot(10014)       kSnapshot(10)
#   glra   EXTRA_GLRA          snapshot(10014)       kSnapshot(10)
#   hkt    EXTRA_HKT           snapshotHKT(20005)    kHKTSnapshot(12)
#   future EXTRA_FUTURE        snapshotfuture(20007) kFutureSnapshot(20)
#   option EXTRA_ETF_OP        snapshotoption(20008) kOptionSnapshot(11)
# ---------------------------------------------------------------------------

# 每天 list_time 拉哪些市场的代码表。all = 全部 8 类(推荐: 拉表很便宜, 表全了
# 以后想加市场只改下面 subscribe_markets 重启即可, 不用重拉表)。
fetch_markets = all

# 开盘后订阅哪些市场(必须是 fetch_markets 的子集)。逗号分隔, 顺序无所谓。
# 要全市场就写成 all (= stock,etf,index,kzz,glra,hkt,future,option)。
# 资源参考(2GB 内存机器实测): 全 8 类约 11700 只, 订阅增量 ~183MB、稳态 ~1514MB;
# tick 约 4000-4500/s, 其中期权占 37%、期货 13%。
subscribe_markets = stock,etf,index

# 拉表时间。8 类约 11700 只, 拉一遍约 2 分钟; 与 subscribe_time 之间留出余量。
# 注意 hold_start~subscribe_time 是"表定版窗口", 只拉表不建订阅。
list_time = 09:05
hold_start = 09:00
subscribe_time = 09:15
# 说明: 旧的 security_types / period 两个键已废弃(周期改为按市场自动选择), 无需再配。

[relogin]
# 每天在进程内换 TGW 会话的时间点(不重启进程, 前端运行计时不归零)
# 也可写显式区间, 如 03:58-04:01,21:00
times = 04:10,09:00,21:00
logout_lead_min = 2

[ws]
# 推送缓冲是覆盖式的(每只代码只留最新一份), 没有"队列上限"可配
# queue_max 已废弃, 写了也不生效
# queue_max = 5000
